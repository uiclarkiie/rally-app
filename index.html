const btn=(label,action,klass='',id='')=>{let name=label.includes('←')?'back':label.includes('✓')?'check':label.includes('↓')?'down':label.includes('↗')||label.includes('→')?'arrow':label.startsWith('+')?'plus':action==='close'?'close':action==='rotate'?(state.active.length?'rotate':'play'):null;let text=label.replace(/[←✓↓↗→×]/g,'').replace(/^\+\s*/,'').trim();const before=['back','check','plus','play','rotate'].includes(name);return '<button class="'+klass+'" data-action="'+action+'" data-id="'+id+'"'+(action==='close'?' aria-label="Close dialog"':'')+'>'+(before?icon(name):'')+(text?'<span>'+text+'</span>':'')+(name&&!before?icon(name):'')+'</button>'};
const clubBy=id=>clubs.find(c=>c.id===id)||clubs[0];
const initials=name=>name.split(' ').map(n=>n[0]).join('').slice(0,2);
function toast(message){$('#toast').textContent=message;$('#toast').style.display='block';clearTimeout(toast.timer);toast.timer=setTimeout(()=>$('#toast').style.display='none',3000)}
function go(route){if(location.hash===`#${route}`)render();else location.hash=route;window.scrollTo(0,0)}
function modal(content){returnFocus=document.activeElement;$('#modal').innerHTML=btn('×','close','close')+content;$('#modal').showModal()}
function close(){ $('#modal').close();returnFocus?.focus() }
function authenticate(action){pending=action;modal(`<span class="eyebrow">YOUR PEOPLE ARE HERE</span><h2 id="modal-title">Let’s get you playing.</h2><p class="muted">Join clubs, meet the players and see every Rally Session. Community membership is free.</p>${btn('G &nbsp; Continue with Google','google','primary')}<p class="note">Demo sign-in only. No Google account or credentials are used.</p>`)}
function gate(action,premium=false){if(state.access==='guest'){authenticate(()=>gate(action,premium));return}if(premium&&!clubPremium()){modal(`<span class="eyebrow">CLUB PREMIUM</span><h2 id="modal-title">Upgrade this club.</h2><p>Queue Master, Announcements and Events help you keep your club moving.</p><p class="note">All members share their club’s Premium experience. This is a demo — no payment required.</p>${btn('Try Premium club demo','upgrade','primary')}`);pending=action;return}action()}
function clubCard(c){return `<article class="card"><a href="#club/${c.id}" class="club-art ${c.style}" aria-label="View ${c.name}"><span>${c.mark}</span></a><div class="card-body"><div class="stack"><span class="tag">${c.sport}</span>${planBadge(c)}</div><h3><a href="#club/${c.id}">${c.name}</a></h3><p class="muted">${c.area}</p><p>${c.members} members · All levels welcome</p><div class="row" style="margin-top:20px">${btn('Explore club ↗','club','text',c.id)}<span class="note">${state.joined.includes(c.id)&&state.access!=='guest'?'✓ Joined':'Open community'}</span></div></div></article>`}
function discover(){let filtered=clubs.filter(c=>(sport==='All sports'||c.sport===sport)&&`${c.name} ${c.area} ${c.sport}`.toLowerCase().includes(query.toLowerCase()));return `<section id="discover-clubs"><div class="section-head"><h2>Discover clubs</h2><span class="note">DUBAI, UAE</span></div><input id="search" class="search" aria-label="Search clubs" placeholder="Search clubs, sports or neighborhoods" value="${escapeHTML(query)}"><div class="filters">${['All sports','Badminton','Pickleball','Padel'].map(s=>btn(s,'filter',s===sport?'selected':'',s)).join('')}</div><div class="grid" id="club-results">${filtered.map(clubCard).join('')||'<p class="muted">No clubs found. Try another search or sport.</p>'}</div></section>`}
function playerList(c,full){return players.slice(0,full?c.members:3).map((p,i)=>`<div class="list-item"><span class="initial">${initials(p)}</span><div class="text-content"><strong>${p}</strong><p class="muted">${i%2?'Intermediate':'Social player'} · ${c.sport}</p></div>${btn('Profile ↗','player','text',String(i))}</div>`).join('')}
function sessionRow(s){const c=clubBy(s.club);return `<div class="list-item"><div class="session-date">${s.day}<small>${s.month}</small></div><div class="text-content"><strong>${escapeHTML(s.title)}</strong><p>${c.name} · ${s.time}</p><span class="note">${s.count+Number(state.rsvps.includes(s.id))}/${s.capacity} players</span></div>${btn('View ↗','session','',s.id)}</div>`}
let clubOrigin='discover';try{clubOrigin=sessionStorage.getItem('rally-club-origin')==='clubs'?'clubs':'discover'}catch{}
document.addEventListener('click',e=>{const target=e.target.closest('a[href^="#club/"],button[data-action="club"]');if(!target)return;const route=location.hash.slice(1).split('/')[0]||'discover';if(route==='discover'||route==='clubs'){clubOrigin=route;try{sessionStorage.setItem('rally-club-origin',clubOrigin)}catch{}}},true);
function clubPage(c){return btn(clubOrigin==='clubs'?'← My clubs':'← Discover',clubOrigin==='clubs'?'my-clubs':'discover','text back')+planBadge(c)+'<div class="club-art '+c.style+'" style="height:160px;border-radius:8px"><span>'+c.mark+'</span></div><div class="section-head"><div><span class="eyebrow">'+c.sport+' / '+c.area+'</span><h2>'+c.name+'</h2></div>'+btn(state.access!=='guest'&&state.joined.includes(c.id)?'✓ Joined · Leave':'Join club','join','primary',c.id)+'</div><p class="muted">'+c.description+'</p><button class="member-count" data-action="members" data-id="'+c.id+'">'+icon('user')+'<span><strong>'+c.members+'</strong> members</span>'+icon('arrow')+'</button><section class="panel"><span class="eyebrow">NEXT SESSION</span>'+sessionRow(sessions.find(s=>s.club===c.id))+'</section>'+clubTools(c)}

function members(c){return `${btn('← Back to club','club','text back',c.id)}<span class="eyebrow">${c.name}</span><h1 style="font-size:48px">Members</h1><p class="muted">${c.members} members · ${c.sport}</p><div class="panel">${playerList(c,true)}</div>`}
function sessionPage(s){const c=clubBy(s.club),joined=state.rsvps.includes(s.id);return `${btn('← All sessions','sessions','text back')}<span class="eyebrow">RALLY SESSION / ${c.sport}</span><h1 style="font-size:48px">${s.title}</h1><p class="muted">Hosted by ${c.name}</p><div class="split"><div class="panel"><h3>Game plan</h3><p><strong>${s.day} ${s.month} 2026 · ${s.time}</strong><br>${s.venue}</p><p>Social doubles. All levels welcome. Bring your racket, water and good energy. Arrive 15 minutes early for warm-up and check-in.</p><div class="stats"><div class="stat"><strong>${s.count+Number(joined)}</strong><small>of ${s.capacity} spots</small></div><div class="stat"><strong>${s.price}</strong><small>AED per player</small></div><div class="stat"><strong>2h</strong><small>court time</small></div></div>${btn(joined?'Cancel my spot':'Reserve my spot','rsvp','primary full',s.id)}<p class="note">Demo reservation. No booking or payment is made.</p></div><div class="panel"><h3>Who’s playing</h3>${playerList(c,false)}${btn('Meet all club players →','members','full',c.id)}</div></div>`}
function profile(index){let own=index===undefined,name=own?state.nickname:players[Number(index)]||players[0];return `<span class="eyebrow">PLAYER PROFILE</span><h1 style="font-size:48px">${escapeHTML(name)}.</h1><p class="muted">Dubai · Here for the games and the good company.</p><div class="stats"><div class="stat"><strong>${own?state.joined.length:2}</strong><small>clubs</small></div><div class="stat"><strong>${own?state.rsvps.length:12}</strong><small>${own?'reserved sessions':'rallies played'}</small></div><div class="stat"><strong>${own?'Free':'Social'}</strong><small>${own?'membership':'player style'}</small></div></div><div class="panel"><h3>Sports on rotation</h3><div class="stack"><span class="tag">Badminton</span><span class="tag">Pickleball</span><span class="tag">Padel</span></div>${own?btn('Edit nickname','edit-name')+ ' '+btn('Sign out','signout','text'):btn('Find a session together ↗','sessions','primary')}</div>`}

const sessionConfigs=state.sessionConfigs||{bad:{courts:1,slots:16,end:'21:00',mode:'doubles',matches:[]},pickle:{courts:1,slots:12,end:'10:00',mode:'doubles',matches:[]}};
for(const [key,start,end,slots] of [['bad','19:00','21:00',16],['pickle','08:00','10:00',12],['padel','20:00','22:00',12]]){sessionConfigs[key]={courts:1,slots,start,end,mode:'doubles',matches:[],scoring:'off',scores:[],...sessionConfigs[key]};}
state.sessionConfigs=sessionConfigs;
// Preserve any running match from the original prototype.
if(state.active.length&&!sessionConfigs.bad.matches.length){sessionConfigs.bad.matches[0]=state.active;state.active=[];persist()}
// Apply the requested defaults once to older saved demo sessions, preserving every player.
if(state.queueDefaultsVersion!==2){
 const c=sessionConfigs.bad;
 for(const match of c.matches){for(const name of match||[]){if(!state.queue.includes(name))state.queue.push(name)}}
 c.matches=[];c.scores=[];c.courts=1;c.mode='doubles';
 state.queueDefaultsVersion=2;persist();
}

function organizer(){return '<span class="eyebrow">CLUB ORGANIZER</span><h1 style="font-size:48px">Your club.<br>Your games.</h1><div class="grid">'+clubs.map(c=>'<article class="card card-body"><span class="tag">'+c.sport+' · '+(state.clubPlans[c.id]?'Premium':'Free')+'</span><h3>'+c.name+'</h3>'+btn('Open club','club','primary',c.id)+'</article>').join('')+'</div>'}
function sessionKey(){return location.hash.includes('openplay')?'pickle':location.hash.includes('padel')?'padel':'bad'}
function courtVisual(sport,active=[],mode='doubles'){
 const pickle=sport==='Pickleball';const positions=mode==='singles'?[[175,150],[465,150]]:[[175,90],[175,210],[465,90],[465,210]];
 const lines=sport==='Padel'?'<rect x="28" y="13" width="584" height="274" class="glass-wall"/><path d="M124 25V275 M516 25V275 M124 150H516"/>':pickle?'<rect class="kitchen" x="231" y="25" width="178" height="250"/><path d="M231 25V275 M409 25V275 M40 150H231 M409 150H600"/>':'<path d="M40 45H600 M40 255H600 M72 25V275 M568 25V275 M237 25V275 M403 25V275 M40 150H237 M403 150H600"/>';
 return '<div class="court-map horizontal"><svg viewBox="0 0 640 300" role="img" aria-label="'+sport+' '+mode+' court, '+(active.length?'match in play':'available')+'"><g class="court-lines"><rect x="40" y="25" width="560" height="250"/>'+lines+'</g><path class="court-net" d="M320 15V285"/>'+positions.map(([x,y],i)=>'<g class="court-player '+(active.length?'':'vacant')+'"><circle cx="'+x+'" cy="'+y+'" r="22"/><text class="player-initial" x="'+x+'" y="'+(y+5)+'">'+(active[i]?escapeHTML(initials(active[i])):i+1)+'</text><text class="player-name" x="'+x+'" y="'+(y+42)+'">'+(active[i]?escapeHTML(active[i].split(' ')[0]):'Open spot')+'</text></g>').join('')+'</svg></div>'
}
function queue(){const key=sessionKey(),cfg=sessionConfigs[key],sport=key==='bad'?'Badminton':key==='pickle'?'Pickleball':'Padel',count=state.queue.length+Object.values(sessionConfigs).reduce((n,c)=>n+c.matches.reduce((a,m)=>a+(m?.length||0),0),0);return btn('← Manage club','manage-club','text back',activeClub().id)+'<div class="section-head"><div><span class="eyebrow">PREMIUM / '+sport+'</span><h2>'+ (key==='bad'?'Queue Master':key==='pickle'?'Open Play':'Padel · TBD preview')+'</h2></div><button class="settings-button" data-action="session-settings" aria-label="Session settings">'+gearIcon()+'</button></div><div class="session-summary"><span>'+cfg.courts+' courts</span><span>'+cfg.mode+'</span><span>'+cfg.start+'–'+cfg.end+'</span><span>'+count+' / '+cfg.slots+' players</span></div>'+scoreToggle(key,cfg)+'<div class="courts-grid">'+Array.from({length:cfg.courts},(_,i)=>{const active=cfg.matches[i]||[];return '<section class="panel dark-panel"><div class="row"><strong>Court '+(i+1)+'</strong><span class="court-status">'+(active.length?'IN PLAY':'AVAILABLE')+'</span></div>'+courtVisual(sport,active,cfg.mode)+scoreBoard(key,cfg,i,active.length>0)+btn(active.length?'Finish & rotate':'Start game','court-rotate','full',String(i))+'</section>'}).join('')+'</div><section class="panel"><div class="row"><h3>Waiting · '+state.queue.length+'</h3>'+btn('+ Check in','session-checkin')+'</div>'+state.queue.map((p,i)=>'<div class="list-item"><span class="queue-number">'+(i+1)+'</span><strong class="text-content">'+escapeHTML(p)+'</strong>'+btn('Remove','remove','text',String(i))+'</div>').join('')+'</section>'}
function gearIcon(){return '<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true"><path d="m9 3-.7 2.4-2.2 1L3.8 6l-2 3.5 1.8 1.7v2L1.8 15l2 3.5 2.3-.4 2.2 1L9 21h4l.7-2.4 2.2-1 2.3.4 2-3.5-1.8-1.7v-2l1.8-1.8-2-3.5-2.3.4-2.2-1L13 3Z"/><circle cx="11" cy="12" r="3"/></svg>'}
function settings(){const c=sessionConfigs[sessionKey()];modal('<div class="compact-settings"><h2 id="modal-title">Session settings</h2><div class="custom-controls"><label>Courts<input data-session="courts" type="number" min="1" max="12" value="'+c.courts+'"></label><label>Player slots<input data-session="slots" type="number" min="2" max="200" value="'+c.slots+'"></label><label class="wide">Format<select data-session="mode"><option value="doubles" '+(c.mode==='doubles'?'selected':'')+'>Doubles · 4 players</option><option value="singles" '+(c.mode==='singles'?'selected':'')+'>Singles · 2 players</option></select></label><label>Start<input data-session="start" type="time" value="'+c.start+'"></label><label>End<input data-session="end" type="time" value="'+c.end+'"></label></div><p id="settings-message" role="status" class="note">Changes apply live.</p>'+btn('Done','apply-session','primary full')+'</div>')}
function announcements(){return `${btn('← Organizer','organizer','text back')}<div class="section-head"><div><span class="eyebrow">PREMIUM / ANNOUNCEMENTS</span><h2>Keep the club in the loop.</h2></div>${btn('+ New','new-announcement','primary')}</div>${state.announcements.map(a=>`<article class="panel"><span class="eyebrow">THE BAD CLUB · DEMO POST</span><h3>${escapeHTML(a.title)}</h3><p>${escapeHTML(a.body)}</p></article>`).join('')}<article class="panel"><span class="eyebrow">THE BAD CLUB / CLUB NOTE</span><h3>Good games start with good energy.</h3><p>Bring water, arrive early and welcome a new face. See you on court.</p></article>`}
function events(){return `${btn('← Organizer','organizer','text back')}<div class="section-head"><div><span class="eyebrow">PREMIUM / EVENTS</span><h2>Something to look forward to.</h2></div>${btn('+ Create event','new-event','primary')}</div>${state.events.map(e=>`<div class="panel"><span class="tag">${escapeHTML(e.sport)}</span><h3>${escapeHTML(e.title)}</h3><p>${escapeHTML(e.date)} · ${escapeHTML(e.location)}</p><p class="note">Saved locally as a demo event.</p></div>`).join('')||'<div class="empty"><h3>Your next club moment starts here.</h3><p class="muted">Create a tournament, social or open play day.</p></div>'}`}
function render(){let [route,id]=location.hash.slice(1).split('/');route=route||'discover';$('#access').value=state.access;document.querySelectorAll('nav a').forEach(a=>a.classList.toggle('active',a.hash===`#${['club','members'].includes(route)?'discover':route==='session'?'sessions':['queue','openplay','padel','announcements','events'].includes(route)?'organizer':route}`));let protectedRoutes=['clubs','members','sessions','session','profile','player'];if(protectedRoutes.includes(route)&&state.access==='guest'){$('#app').innerHTML=discover();authenticate(()=>render());return}if(['queue','openplay','padel','announcements','events'].includes(route)&&!clubPremium()){$('#app').innerHTML=organizer();gate(()=>render(),true);return}let content=route==='discover'?discover():route==='club'?clubPage(clubBy(id)):route==='members'?members(clubBy(id)):route==='session'?sessionPage(sessions.find(s=>s.id===id)||sessions[0]):route==='sessions'?`<span class="eyebrow">MAKE TIME TO PLAY</span><h1 style="font-size:48px">Your next rally.</h1><p class="muted">Open sessions across all three sports.</p><div class="panel">${sessions.map(sessionRow).join('')}</div>`:route==='clubs'?`<span class="eyebrow">YOUR COMMUNITY</span><h1 style="font-size:48px">Your people. Your clubs.</h1><div class="grid">${clubs.filter(c=>state.joined.includes(c.id)).map(clubCard).join('')}</div>${state.joined.length?'':`<div class="empty"><h3>Find your home court.</h3><p class="muted">Join a club to see it here.</p>${btn('Discover clubs','discover','primary')}</div>`}`:route==='profile'?profile():route==='player'?profile(id):route==='organizer'?organizer():route==='queue'||route==='openplay'?queue():route==='padel'?queue():route==='announcements'?announcements():route==='events'?events():discover();$('#app').innerHTML=content}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const {action,id}=b.dataset;if(action==='close'){pending=null;close();return}if(action==='google'){ $('#modal').innerHTML=btn('×','close','close')+`<span class="eyebrow">ONE LAST THING</span><h2 id="modal-title">What should we call you?</h2><p class="muted">Choose your player nickname.</p><form id="nickname-form"><label for="nickname">Nickname</label><input id="nickname" name="nickname" required minlength="2" maxlength="24" autocomplete="nickname" placeholder="Your court-side name"><button class="primary">Let’s play →</button></form>`;$('#nickname').focus();return}if(action==='upgrade'){state.clubPlans[activeClub().id]=true;persist();close();const next=pending;pending=null;next?.();render();toast('Club Premium demo unlocked');return}if(action==='court-sport'){gate(()=>{if(!clubs.some(c=>c.sport===id))return;state.queueSport=id;persist();render()},true);return}if(action==='find'){$('#discover-clubs').scrollIntoView({behavior:'smooth'});return}if(action==='filter'){sport=id;render();return}if(action==='join'){gate(()=>{state.joined=state.joined.includes(id)?state.joined.filter(c=>c!==id):[...state.joined,id];persist();render();toast(state.joined.includes(id)?'You’re in. Welcome to the club!':'You left the club')});return}if(action==='rsvp'){gate(()=>{state.rsvps=state.rsvps.includes(id)?state.rsvps.filter(s=>s!==id):[...state.rsvps,id];persist();render();toast(state.rsvps.includes(id)?'Your demo spot is reserved':'Reservation cancelled')});return}if(action==='signout'){state.access='guest';persist();go('discover');toast('Signed out');return}if(action==='edit-name'){modal(`<h2 id="modal-title">Edit nickname</h2><form id="edit-form"><label for="nickname">Nickname</label><input id="nickname" name="nickname" required minlength="2" maxlength="24" value="${escapeHTML(state.nickname)}"><button class="primary">Save nickname</button></form>`);return}if(['rotate','remove','checkin','new-announcement','new-event'].includes(action)){gate(()=>{if(action==='rotate'){if(state.active.length){state.queue.push(...state.active);state.active=[];toast('Game finished. Players returned to the queue')}else if(state.queue.length>=(state.queueMode==='singles'?2:4)){state.active=state.queue.splice(0,state.queueMode==='singles'?2:4);toast('Court 1 is ready')}else toast('You need '+(state.queueMode==='singles'?'two':'four')+' waiting players');persist();render()}if(action==='remove'){state.queue.splice(Number(id),1);persist();render()}if(action==='checkin'){if([...state.queue,...state.active].includes(state.nickname)){toast('You are already checked in');return}state.queue.push(state.nickname);persist();render();toast('You joined the queue')}if(action==='new-announcement')modal(`<h2 id="modal-title">New announcement</h2><form id="announcement-form"><label for="title">Title</label><input id="title" name="title" required maxlength="80"><label for="body">Message</label><textarea id="body" name="body" required maxlength="1000"></textarea><button class="primary">Post demo announcement</button></form>`);if(action==='new-event')modal(`<h2 id="modal-title">Create an event</h2><form id="event-form"><label for="title">Event name</label><input id="title" name="title" required maxlength="80"><label for="event-sport">Sport</label><select id="event-sport" name="sport"><option>Badminton</option><option>Pickleball</option><option>Padel</option></select><label for="date">Date</label><input type="date" id="date" name="date" required min="2026-10-06"><label for="location">Venue</label><input id="location" name="location" required maxlength="100"><button class="primary">Create demo event</button></form>`)},true);return}const routes={club:`club/${id}`,members:`members/${id}`,session:`session/${id}`,player:`player/${id}`,profile:'profile',discover:'discover',sessions:'sessions',organizer:'organizer',queue:'queue',announcements:'announcements',events:'events'};if(routes[action])go(routes[action])});
document.addEventListener('submit',e=>{e.preventDefault();let f=e.target,d=new FormData(f);if(f.id==='nickname-form'||f.id==='edit-form'){let name=String(d.get('nickname')).trim();if(name.length<2){$('#nickname').setCustomValidity('Use at least two non-space characters.');$('#nickname').reportValidity();return}state.nickname=name;if(f.id==='nickname-form'){state.access='free';persist();close();const next=pending;pending=null;next?.();render();toast('Welcome to RALLY, '+name)}else{persist();close();render();toast('Nickname updated')}}if(f.id==='announcement-form'){state.announcements.unshift({title:d.get('title'),body:d.get('body')});persist();close();render();toast('Demo announcement posted')}if(f.id==='event-form'){state.events.unshift(Object.fromEntries(d));persist();close();render();toast('Demo event created')}});
document.addEventListener('input',e=>{if(e.target.id==='nickname')e.target.setCustomValidity('');if(e.target.id==='search'){query=e.target.value;$('#club-results').innerHTML=clubs.filter(c=>(sport==='All sports'||c.sport===sport)&&`${c.name} ${c.area} ${c.sport}`.toLowerCase().includes(query.toLowerCase())).map(clubCard).join('')||'<p class="muted">No clubs found. Try another search or sport.</p>'}});

$('#modal').addEventListener('cancel',()=>{pending=null});

document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const a=b.dataset.action,c=sessionConfigs[sessionKey()];if(a==='sport-organizer')state.organizerClub=b.dataset.id;if(a==='sport-organizer')gate(()=>go(b.dataset.id==='bad'?'queue':b.dataset.id==='pickle'?'openplay':'padel'),true);if(a==='session-settings')gate(settings,true);if(a==='court-rotate')gate(()=>{const i=Number(b.dataset.id),m=c.matches[i]||[],need=c.mode==='singles'?2:4;if(m.length){state.queue.push(...m);c.matches[i]=[];c.scores[i]=null}else if(state.queue.length>=need){c.matches[i]=state.queue.splice(0,need);c.scores[i]={points:[0,0],games:[0,0],history:[]}}else{toast('Need '+need+' waiting players');return}persist();render()},true);if(a==='session-checkin')gate(()=>{const all=Object.values(sessionConfigs).flatMap(c=>c.matches.flat());if([...state.queue,...all].includes(state.nickname)){toast('Already checked in');return}if(state.queue.length+all.length>=c.slots){toast('Session is full. Increase player slots in settings.');return}state.queue.push(state.nickname);persist();render()},true)});

function applySessionSettings(closeAfter=false){
 if(!clubPremium())return;const c=sessionConfigs[sessionKey()],message=$('#settings-message');if(!message)return;
 const fields=[...document.querySelectorAll('#modal [data-session]')];const draft=Object.fromEntries(fields.map(f=>[f.dataset.session,f.value]));draft.courts=Number(draft.courts);draft.slots=Number(draft.slots);
 const error=text=>{message.textContent=text;message.classList.add('settings-error');return false};
 if(!Number.isInteger(draft.courts)||draft.courts<1||draft.courts>12)return error('Choose between 1 and 12 courts.');
 if(!Number.isInteger(draft.slots)||draft.slots<2||draft.slots>200)return error('Choose between 2 and 200 player slots.');
 if(!/^\d{2}:\d{2}$/.test(draft.start)||!/^\d{2}:\d{2}$/.test(draft.end))return error('Choose session start and end times.');
 if(c.matches.slice(draft.courts).some(m=>m?.length))return error('Finish games on the courts you want to remove.');
 if(draft.mode!==c.mode&&c.matches.some(m=>m?.length))return error('Finish active games before changing singles or doubles.');
 const count=state.queue.length+Object.values(sessionConfigs).flatMap(c=>c.matches.flat()).length;
 if(draft.slots<count)return error('Player slots must be at least '+count+' for the checked-in players.');
 Object.assign(c,draft);if(c.matches.length>c.courts)c.matches.length=c.courts;state.sessionConfigs=sessionConfigs;persist();render();message.classList.remove('settings-error');message.textContent='Applied: '+c.courts+' courts · '+c.mode+' · '+c.slots+' slots · ends '+c.end+'.';
 if(closeAfter){close();toast('Session settings applied')}return true;
}
function sessionSettingsChanged(e){if(e.target.matches('[data-session]'))applySessionSettings()}
document.addEventListener('input',sessionSettingsChanged);
document.addEventListener('change',sessionSettingsChanged);
document.addEventListener('click',e=>{if(e.target.closest('[data-action="apply-session"]'))applySessionSettings(true)});

document.addEventListener('click',e=>{if(e.target.closest('[data-action="my-clubs"]'))go('clubs')});

function scoreToggle(key,c){const options=key==='bad'?['off','21','31']:key==='pickle'?['off','11','15','21']:['off','advantage'];return '<div class="score-toggle"><span class="eyebrow">SCORES</span><div class="filters">'+options.map(v=>'<button data-action="scoring-toggle" data-id="'+v+'" aria-pressed="'+(c.scoring===v)+'" class="'+(c.scoring===v?'selected':'')+'">'+(v==='off'?'Off':v==='advantage'?'Advantage':v)+'</button>').join('')+'</div></div>'}
function scoreBoard(key,c,i,playing){if(c.scoring==='off')return '';const score=c.scores[i]||{points:[0,0],games:[0,0]},p=score.points;const padel=key==='padel';const label=t=>padel?(p[t]>=3&&p[1-t]>=3?(p[t]>p[1-t]?'AD':'40'):[0,15,30,40][Math.min(p[t],3)]):p[t];return '<div class="score-board">'+[0,1].map(t=>'<button data-action="score-point" data-id="'+i+':'+t+'" '+(!playing?'disabled':'')+' aria-label="Add point to Team '+(t+1)+' on Court '+(i+1)+'"><small>TEAM '+(t+1)+(padel?' · '+score.games[t]+' games':'')+'</small><strong>'+label(t)+'</strong><span>+ Point</span></button>').join('')+'</div><div class="row score-note"><span>'+ (padel?'Advantage scoring · game tally':c.scoring+' points · manual scoring')+'</span>'+btn('Undo','score-undo','text',String(i))+'</div>'}
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b||!clubPremium())return;const c=sessionConfigs[sessionKey()],a=b.dataset.action;if(a==='scoring-toggle'){const options=sessionKey()==='bad'?['off','21','31']:sessionKey()==='pickle'?['off','11','15','21']:['off','advantage'];if(!options.includes(b.dataset.id))return;c.scoring=b.dataset.id;persist();render()}if(a==='score-point'){const [i,t]=b.dataset.id.split(':').map(Number);if(!c.matches[i]?.length)return;const score=c.scores[i]||(c.scores[i]={points:[0,0],games:[0,0],history:[]});score.history.push({points:[...score.points],games:[...score.games]});score.points[t]++;if(sessionKey()==='padel'&&score.points[t]>=4&&score.points[t]-score.points[1-t]>=2){score.games[t]++;score.points=[0,0];toast('Game to Team '+(t+1))}persist();render()}if(a==='score-undo'){const score=c.scores[Number(b.dataset.id)],prev=score?.history?.pop();if(prev){score.points=prev.points;score.games=prev.games;persist();render()}}});

document.addEventListener('change',e=>{const id=e.target.dataset.clubPlan;if(!id)return;state.clubPlans[id]=e.target.value==='premium';persist();render();toast(clubBy(id).name+' · '+(state.clubPlans[id]?'Premium':'Free')+' club')});
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;if(['club-announcements','club-events'].includes(b.dataset.action)){state.organizerClub=b.dataset.id;persist();gate(()=>go(b.dataset.action==='club-events'?'events':'announcements'),true)}});
</script><script>/* Browser-local community prototype. */
state.createdSessions=state.createdSessions||[];state.requests=state.requests||[];state.notifications=state.notifications||[];state.roles=state.roles||{bad:'admin'};state.skills=state.skills||{Badminton:{level:'Intermediate',lockedUntil:0},Pickleball:{level:'Beginner',lockedUntil:0},Padel:{level:'Beginner',lockedUntil:0}};state.location=state.location||'Dubai';
sessions.push(...state.createdSessions);let profileSport=Object.keys(state.skills)[0]||'Badminton';
const oldProfile=profile,oldRender=render;
function clubAvatar(c){return '<span class="club-avatar '+c.style+'">'+c.mark+'</span>'}
clubCard=function(c){return `<article class="card compact-club"><div class="row">${clubAvatar(c)}<div class="text-content"><h3><a href="#club/${c.id}">${c.name}</a></h3><span class="note">${c.sport} · ${c.area}</span></div></div>${planBadge(c)}<div class="row"><span class="note">${c.members} members</span>${btn('Explore club →','club','text',c.id)}</div></article>`};
clubTools=function(c){return `<div class="stack">${btn('Manage club','manage-club','',c.id)}${btn('+ Create session','create-session','primary',c.id)}</div>`};
clubPage=function(c){return `${btn(clubOrigin==='clubs'?'← My clubs':'← Discover',clubOrigin==='clubs'?'my-clubs':'discover','text back')}<div class="row">${clubAvatar(c)}<div><h2>${c.name}</h2>${planBadge(c)}</div></div><p>${c.description}</p><div class="stack">${btn(state.joined.includes(c.id)?'✓ Joined · Leave':'Join club','join','',c.id)}${btn(c.members+' members','members','',c.id)}</div><section class="panel"><div class="row"><h3>Sessions</h3>${btn('+ Create session','create-session','',c.id)}</div>${sessions.filter(s=>s.club===c.id).map(sessionRow).join('')}</section>${btn('Manage club','manage-club','full',c.id)}`};
function manageClub(c){state.organizerClub=c.id;return `${btn('← Back to club','club','text back',c.id)}<span class="eyebrow">${c.name}</span><h2>Manage club</h2><p class="note">Demo role: ${state.roles[c.id]==='admin'?'Club admin':'Member'} <button data-action="demo-role" data-id="${c.id}">Switch role</button></p><section class="panel"><h3>Sessions · Free for every club</h3>${btn('+ Create session','create-session','primary',c.id)}${sessions.filter(s=>s.club===c.id).map(sessionRow).join('')}</section><section class="panel"><div class="row">${planBadge(c)}<label>DEMO · CLUB PLAN<select data-club-plan="${c.id}" aria-label="${c.name} club plan"><option value="free">Free</option><option value="premium" ${state.clubPlans[c.id]?'selected':''}>Premium</option></select></label></div><div class="stack">${btn(c.id==='bad'?'Queue Master':c.id==='pickle'?'Open Play':'Padel · TBD','sport-organizer','',c.id)}${btn('Announcements','club-announcements','',c.id)}${btn('Events','club-events','',c.id)}</div></section>${requestPanel(c)}<section class="panel"><h3>Notifications</h3>${state.notifications.filter(n=>n.club===c.id).map(n=>'<p>'+escapeHTML(n.text)+'</p>').join('')||'<p class="note">No notifications yet.</p>'}<p class="note">Notifications and approvals are simulated on this browser.</p></section>`}
function requestPanel(c){const admin=state.roles[c.id]==='admin';return '<section class="panel"><h3>Pending requests</h3>'+state.requests.filter(r=>r.club===c.id&&r.status==='pending').map(r=>'<div class="list-item"><div class="text-content">'+escapeHTML(r.name)+' · '+escapeHTML(r.label)+'</div>'+((admin||sessions.find(s=>s.id===r.session)?.creator===state.nickname)?btn('Approve','approve-request','',r.id)+btn('Decline','decline-request','text',r.id):'<span class="note">Awaiting club admin</span>')+'</div>').join('')+'<p class="note">Switch the demo role to Club admin to review requests.</p></section>'}
function input(label,name,type='text',value='',extra=''){return `<label>${label}<input name="${name}" type="${type}" value="${escapeHTML(value)}" ${extra}></label>`}
function createSession(id){modal(`<h2 id="modal-title">Create session</h2><form id="create-session-form" data-club="${id}" class="form-grid">${input('Session name','title','text','','required maxlength="80"')}${input('Date','date','date','','required')}${input('Address','venue','text','','required maxlength="180"')}${input('Start','start','time','19:00','required')}${input('End','end','time','21:00','required')}${input('Courts','courts','number',1,'required min="1" max="12"')}${input('Price per player (AED)','price','number',0,'required min="0" step="0.01"')}${input('Player capacity','capacity','number',16,'required min="2" max="200"')}<label>Format<select name="format"><option>Doubles</option><option>Singles</option></select></label><label>Repeat<select name="repeat"><option value="none">One-time</option><option value="daily">Every day</option><option value="weekly">Every week</option><option value="monthly">Every month</option></select></label><label>Visibility<select name="visibility"><option value="public">Public · auto join</option><option value="private">Private · ID or approval</option></select></label><p class="note wide">Sport: ${clubBy(id).sport}. Times use the club’s local time. No payment is collected.</p><button class="primary wide">Create session</button><p id="form-error" role="status" class="wide"></p></form>`)}
function sessionLink(s){return 'https://uiclarkiie.github.io/rally-app/#session/'+s.id}
function shareSession(s){modal(`<h2 id="modal-title">Session created</h2><p>${escapeHTML(s.title)}</p><label>Session link<input id="share-link" readonly value="${sessionLink(s)}"></label>${btn('Copy link','copy-session','primary',s.id)}${s.visibility==='private'?'<p>Private session ID: <strong>'+s.code+'</strong></p><p class="note">Share this ID with invited players. Players without it can request approval.</p>':''}<p class="note">This prototype stores new sessions on this browser. The link works here; cross-device sharing needs a backend.</p>${btn('View session','view-created','',s.id)}`)}
sessionPage=function(s){const c=clubBy(s.club),joined=state.rsvps.includes(s.id),req=state.requests.find(r=>r.session===s.id&&r.status==='pending');return `${btn('← Back to club','club','text back',c.id)}<span class="eyebrow">${s.visibility==='private'?'PRIVATE':'PUBLIC'} SESSION · ${c.sport}</span><h2>${escapeHTML(s.title)}</h2><p>${escapeHTML(s.date||`${s.day} ${s.month} 2026`)} · ${escapeHTML(s.time)}</p><section class="panel"><p>${escapeHTML(s.venue)}</p><span class="tag">${({none:"One-time",daily:"Every day",weekly:"Every week",monthly:"Every month"})[s.repeat||"none"]}</span>${s.repeat&&s.repeat!=="none"?'<p class="note">Repeat schedule saved for this demo. Future occurrences are not automatically created yet.</p>':""}<div class="stats"><div><strong>${s.count+Number(joined)}/${s.capacity}</strong><p>Players</p></div><div><strong>${s.courts||1}</strong><p>Courts · ${s.format||'Doubles'}</p></div><div><strong>${s.price} AED</strong><p>Per player</p></div></div>${btn(joined?'Leave session':req?'Request sent':'Join session','join-session','primary full',s.id)}${btn('Share session','share-session','full',s.id)}<p class="note">${s.visibility==='private'?'Join with a session ID, or request approval.':'Joining automatically notifies the organizer in this demo.'}</p></section><section class="panel"><h3>Players</h3>${playerList(c,false)}</section>`};
function joinSession(s,code){if(state.rsvps.includes(s.id)){state.rsvps=state.rsvps.filter(id=>id!==s.id);persist();render();return}if(s.count+1>s.capacity){toast('Session is full');return}if(s.visibility==='private'&&code!==s.code){if(!state.requests.some(r=>r.session===s.id&&r.status==='pending'))state.requests.push({id:crypto.randomUUID(),club:s.club,session:s.id,name:state.nickname,label:s.title,status:'pending'});state.notifications.unshift({club:s.club,text:state.nickname+' requested to join '+s.title});toast('Request sent · awaiting approval')}else{state.rsvps.push(s.id);state.notifications.unshift({club:s.club,text:state.nickname+' joined '+s.title});toast('You joined the session')}persist();render()}
profile=function(index){if(index!==undefined)return oldProfile(index);const names=Object.keys(state.skills);if(!names.includes(profileSport))profileSport=names[0];return `<div class="section-head"><div><span class="eyebrow">PLAYER PROFILE</span><h2>${escapeHTML(state.nickname)}</h2></div><button data-action="profile-settings" aria-label="Profile settings" class="settings-button">${gearIcon()}</button></div><div class="row">${state.photo?'<img class="profile-photo" src="'+state.photo+'" alt="Profile photo">':'<span class="initial">'+escapeHTML(initials(state.nickname))+'</span>'}<p>${escapeHTML(state.location)}</p></div><div class="filters" role="tablist">${names.map(n=>'<button role="tab" aria-selected="'+(n===profileSport)+'" data-action="profile-sport" data-id="'+n+'">'+n+'</button>').join('')}</div><section class="panel">${profileSport?'<span class="tag">'+escapeHTML(state.skills[profileSport].level)+'</span>':''}${profileSport==='Badminton'?'<h3>Stats & history</h3><div class="stats"><div><strong>'+state.rsvps.length+'</strong><p>Joined sessions</p></div><div><strong>—</strong><p>Games played</p></div><div><strong>—</strong><p>Win rate</p></div></div><h3>Session history</h3>'+sessions.filter(s=>state.rsvps.includes(s.id)&&clubBy(s.club).sport==='Badminton').map(sessionRow).join('')+'<p class="note">Match statistics will appear once game history is connected.</p>':profileSport==='Pickleball'?'<h3>DUPR</h3><p>'+escapeHTML(state.dupr||'Not added yet')+'</p><p class="note">Self-entered demo rating · not verified by DUPR.</p>':profileSport==='Padel'?'<h3>Padel · TBD</h3>':'<p>Add a sport in Edit Profile.</p>'}</section>`};
function profileSettings(){modal('<h2 id="modal-title">Profile settings</h2><div class="vertical-actions">'+btn('Edit Profile','edit-profile','full')+btn('Manage clubs','profile-clubs','full')+btn('Sign out','profile-signout','text full')+'</div>')}
function editProfile(){const now=Date.now();modal(`<h2 id="modal-title">Edit Profile</h2><form id="profile-form">${input('Display name','display','text',state.nickname,'required minlength="2" maxlength="24"')}${input('Location','location','text',state.location,'required maxlength="100"')}<label>Profile photo · JPG/PNG, max 5 MB, 512 × 512<input type="file" id="profile-photo" accept="image/jpeg,image/png"></label><p id="photo-status" role="status" class="note"></p>${btn('Remove photo','remove-photo','text')}<h3>Sports & skill levels</h3>${['Badminton','Pickleball','Padel'].map(n=>{const s=state.skills[n],locked=s&&s.lockedUntil>now;return `<div class="sport-edit"><label><input type="checkbox" name="sport" value="${n}" ${s?'checked':''}> ${n}</label><select name="skill-${n}" aria-label="${n} skill level" ${locked?'disabled':''}>${['Beginner','Intermediate','Advanced'].map(l=>'<option '+(s?.level===l?'selected':'')+'>'+l+'</option>').join('')}</select>${locked?'<p class="note">Locked until '+new Date(s.lockedUntil).toLocaleDateString()+'.</p>'+btn('Request skill change','skill-request','text',n):''}</div>`}).join('')}${input('DUPR rating (optional)','dupr','number',state.dupr||'','min="2" max="8" step="0.001"')}<p class="note">A skill level locks for one month after it is saved. Removing a sport does not reset its lock.</p><button class="primary full">Save profile</button><p id="profile-error" role="status"></p></form>`)}
function profileClubs(){modal('<h2 id="modal-title">Manage clubs</h2>'+state.joined.map(id=>{const c=clubBy(id);return '<div class="list-item">'+clubAvatar(c)+'<div class="text-content"><strong>'+c.name+'</strong><p class="note">'+(state.roles[id]==='admin'?'Club admin':'Member')+'</p></div>'+btn('Open','open-managed-club','text',id)+btn('Leave','leave-managed-club','text',id)+'</div>'}).join('')+(state.joined.length?'':'<p>No joined clubs yet.</p>'))}
render=function(){const [route,id]=location.hash.slice(1).split('/');if(route==='session'&&!sessions.some(s=>s.id===id)){$('#app').innerHTML='<h2>Session unavailable</h2><p>This session is not saved on this browser. Cross-device session sharing needs a backend.</p>'+btn('Browse sessions','sessions','primary');return}if(route==='manage'){if(state.access==='guest'){authenticate(()=>render());return}$('#app').innerHTML=manageClub(clubBy(id));return}if(route==='organizer'){go('clubs');return}oldRender()};
document.addEventListener('click',e=>{const b=e.target.closest('[data-action]');if(!b)return;const {action:a,id}=b.dataset;
 if(a==='manage-club')gate(()=>go('manage/'+id));if(a==='create-session')gate(()=>createSession(id));
 if(a==='demo-role'){state.roles[id]=state.roles[id]==='admin'?'member':'admin';persist();render()}
 if(a==='profile-settings')profileSettings();if(a==='edit-profile')editProfile();if(a==='profile-clubs')profileClubs();if(a==='profile-signout'){close();state.access='guest';persist();go('discover')}
 if(a==='profile-sport'){profileSport=id;render()}
 if(a==='open-managed-club'){close();go('club/'+id)}if(a==='leave-managed-club'){state.joined=state.joined.filter(x=>x!==id);persist();profileClubs()}
 if(a==='remove-photo'){state.photo='';persist();$('#photo-status').textContent='Photo removed.'}
 if(a==='skill-request'){modal('<h2 id="modal-title">Request skill change</h2><form id="skill-request-form" data-sport="'+id+'"><label>Requested level<select name="level"><option>Beginner</option><option>Intermediate</option><option>Advanced</option></select></label><button class="primary">Send request</button></form>')}
 if(a==='share-session')shareSession(sessions.find(s=>s.id===id));if(a==='copy-session')navigator.clipboard.writeText(sessionLink(sessions.find(s=>s.id===id))).then(()=>toast('Link copied')).catch(()=>toast('Select and copy the link above'));if(a==='view-created'){close();go('session/'+id)}
 if(a==='join-session')gate(()=>{const s=sessions.find(s=>s.id===id);if(s.visibility==='private'&&!state.rsvps.includes(id)){modal('<h2 id="modal-title">Join private session</h2><form id="private-join-form" data-session="'+id+'"><label>Session ID<input name="code" placeholder="Enter the invitation ID"></label><button class="primary">Join with ID</button></form>'+btn('Request to join without ID','request-session','full',id))}else joinSession(s)});
 if(a==='request-session'){close();joinSession(sessions.find(s=>s.id===id))}
 if(a==='approve-request'||a==='decline-request'){const r=state.requests.find(r=>r.id===id);if(state.roles[r.club]!=='admin'&&sessions.find(s=>s.id===r.session)?.creator!==state.nickname){toast('Club admin access required');return}const s=sessions.find(s=>s.id===r.session);if(a==='approve-request'&&s&&s.count+Number(state.rsvps.includes(s.id))>=s.capacity){toast('Session is full');return}r.status=a==='approve-request'?'approved':'declined';if(r.status==='approved'){if(r.session&&!state.rsvps.includes(r.session))state.rsvps.push(r.session);if(r.sport){state.skills[r.sport]={level:r.level,lockedUntil:monthFromNow()};state.skillLocks[r.sport]=state.skills[r.sport]}}persist();render();toast('Request '+r.status)}
});
function monthFromNow(){const d=new Date();d.setMonth(d.getMonth()+1);return d.getTime()}
state.skillLocks=state.skillLocks||{};
document.addEventListener('submit',e=>{const f=e.target,d=new FormData(f);if(f.id==='create-session-form'){e.preventDefault();if(d.get('end')<=d.get('start')){$('#form-error').textContent='End must be after start on the same day.';return}const date=d.get('date'),s={...Object.fromEntries(d),id:crypto.randomUUID(),club:f.dataset.club,date,day:Number(date.split('-')[2]),month:new Date(date+'T12:00').toLocaleString('en',{month:'short'}).toUpperCase(),time:d.get('start')+'–'+d.get('end'),count:0,capacity:Number(d.get('capacity')),price:Number(d.get('price')),courts:Number(d.get('courts')),code:crypto.randomUUID().slice(0,8).toUpperCase(),creator:state.nickname};state.createdSessions.push(s);sessions.push(s);persist();close();render();shareSession(s)}
 if(f.id==='private-join-form'){e.preventDefault();const s=sessions.find(s=>s.id===f.dataset.session);if(String(d.get('code')).trim().toUpperCase()!==s.code){toast('Incorrect session ID. Try again or request to join.');return}close();joinSession(s,s.code)}
 if(f.id==='profile-form'){e.preventDefault();const name=String(d.get('display')).trim();if(name.length<2){$('#profile-error').textContent='Enter at least 2 characters.';return}const skills={};for(const n of d.getAll('sport')){const prev=state.skills[n]||state.skillLocks[n];skills[n]=prev?.lockedUntil>Date.now()?prev:{level:d.get('skill-'+n),lockedUntil:monthFromNow()};state.skillLocks[n]=skills[n]}state.skills=skills;state.nickname=name;state.location=String(d.get('location')).trim();state.dupr=d.get('dupr');persist();close();render();toast('Profile saved')}
